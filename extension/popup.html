<!doctype html><html lang="en"><head><meta charset="utf-8"><title>PhishLens</title><link rel="stylesheet" href="popup.css"><script defer src="popup.js"></script></head><body><h1>PhishLens</h1><p>Read the selected text and current URL, then send them to your local app for review.</p><button id="read">Read selection and URL</button><label for="message">Selected text</label><textarea id="message" rows="6" maxlength="20000"></textarea><label for="url">Page URL</label><input id="url" maxlength="2048"><button id="send">Open in local PhishLens</button><p id="status" role="status"></p><p>No background scanning. Nothing is saved automatically. PhishLens must be running at 127.0.0.1:5000.</p></body></html>
